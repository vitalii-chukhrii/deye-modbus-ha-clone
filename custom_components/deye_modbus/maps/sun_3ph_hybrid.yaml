# =====================================================================
# Writable controls (holding registers 60-499, written with FC06/FC16).
# Each control gets a hidden read-back sensor injected automatically so the
# entity reflects the inverter's current value.
# =====================================================================
controls:

  # ------------------------------------------------------------- on/off & modes
  - type: switch
    name: Inverter On/Off
    unique_id: inverter_onoff
    register_type: holding
    address: 80
    on_value: 1
    off_value: 0
    icon: mdi:power
    entity_category: config

  - type: switch
    name: Solar Sell (Export)
    unique_id: solar_sell
    register_type: holding
    address: 145
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-export
    entity_category: config

  - type: switch
    name: Grid Charge Enable
    unique_id: grid_charge_enable
    register_type: holding
    address: 130
    on_value: 1
    off_value: 0
    icon: mdi:battery-charging
    entity_category: config

  - type: switch
    name: Generator Charge Enable
    unique_id: gen_charge_enable
    register_type: holding
    address: 129
    on_value: 1
    off_value: 0
    icon: mdi:engine
    entity_category: config

  - type: select
    name: Work Mode
    unique_id: work_mode
    register_type: holding
    address: 142
    icon: mdi:home-lightning-bolt
    entity_category: config
    options:
      - label: Selling First
        value: 0
      - label: Zero Export To Load
        value: 1
      - label: Zero Export To CT
        value: 2

  # ------------------------------------------------------------- power limits
  - type: number
    name: Max Sell Power
    unique_id: max_sell_power
    register_type: holding
    address: 340
    min: 0
    max: 16000
    step: 100
    unit_of_measurement: W
    mode: box
    write_factor: 1
    entity_category: config

  - type: number
    name: Max Grid Output Power
    unique_id: max_grid_output_power
    register_type: holding
    address: 143
    min: 0
    max: 16000
    step: 100
    unit_of_measurement: W
    mode: box
    write_factor: 1
    entity_category: config

  - type: number

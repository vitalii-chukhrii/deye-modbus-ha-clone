# =====================================================================
# Deye three-phase low-voltage hybrid inverter register map
# Device type 0x0500 - SUN-*K-SG04LP3 / SG05LP3 family (incl. 12K SG05)
#
# Source: Deye "MODBUS RTU 三相储能通信协议" (three-phase energy storage
# communication protocol). All live values live in the holding-register
# space and are read with Modbus function code 0x03.
#
# Decoding notes:
#   * register_type: holding  -> read with FC03 (everything on this inverter)
#   * count: 2                -> 32-bit value across two registers
#   * word_order: low_high    -> low word sits at the base address (Deye energy
#                                counters are little-endian by word)
#   * temperatures            -> offset 1000, scale 0.1  =>  (raw-1000)*0.1 = °C
#   * signed: true            -> value is two's-complement (marked "S16" in doc)
# =====================================================================

sensors:

  # ---------------------------------------------------------------- status
  - name: Run State
    unique_id: run_state
    register_type: holding
    address: 500
    count: 1
    options:
      0: standby
      1: self-check
      2: normal
      3: alarm
      4: fault

  # ---------------------------------------------------------------- PV input
  - name: PV1 Voltage
    unique_id: pv1_voltage
    register_type: holding
    address: 676
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: PV1 Current
    unique_id: pv1_current
    register_type: holding
    address: 677
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement

  - name: PV1 Power
    unique_id: pv1_power
    register_type: holding
    address: 672
    count: 1
    scale: 1
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  - name: PV2 Voltage
    unique_id: pv2_voltage
    register_type: holding
    address: 678
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: PV2 Current
    unique_id: pv2_current
    register_type: holding
    address: 679
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement

  - name: PV2 Power
    unique_id: pv2_power
    register_type: holding
    address: 673
    count: 1
    scale: 1
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  # PV3 / PV4 - present in protocol, not populated on 2-MPPT models (disabled by default)
  - name: PV3 Voltage
    unique_id: pv3_voltage
    register_type: holding
    address: 680
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    enabled_default: false

  - name: PV3 Current
    unique_id: pv3_current
    register_type: holding
    address: 681
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    enabled_default: false

  - name: PV3 Power
    unique_id: pv3_power
    register_type: holding
    address: 674
    count: 1
    scale: 1
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    enabled_default: false

  - name: PV4 Voltage
    unique_id: pv4_voltage
    register_type: holding
    address: 682
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    enabled_default: false

  - name: PV4 Current
    unique_id: pv4_current
    register_type: holding
    address: 683
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement
